<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
  #bg-layer { position: fixed; inset: 0; z-index: 0; {{BG_CSS}} }
  #canvas { display: block; width: 100vw; height: 100vh; background: transparent; position: relative; z-index: 1; opacity: 0; transition: opacity .8s; }
  #canvas.ready { opacity: 1; }
</style>
</head>
<body>
<div id="bg-layer"></div>
<canvas id="canvas"></canvas>
<script src="spine-webgl-3.8.js"></script>
<script src="wallpaper-layout.js"></script>
<script>
// ===== 皮肤配置（导出器注入） =====
var LAYERS = {{LAYERS_JSON}};   // [{ name, skelData(base64), atlasText, textures:[{page,file}] }]
var SCALE = {{SCALE}};          // 百分比：100 = 自适应（20~300）
var OFFSET_X = {{OFFSET_X}};    // 画布宽 %
var OFFSET_Y = {{OFFSET_Y}};    // 画布高 %
var ALIGNMENT = "{{ALIGNMENT}}"; // center / left-top / right-top / left-bottom / right-bottom
var ANIMATION = {{ANIMATION}};  // 导出的初始动画名（空则按 idle/normal 自动选择）
var ANIM_OPTIONS = {{ANIM_OPTIONS}}; // 可在 WE 下拉切换的动画列表

var canvas = document.getElementById("canvas");
var gl = null, renderer = null;
var skeletons = [], pending = new Array(LAYERS.length);
var loadedCount = 0, lastFrame = 0;
var boundsCache = null;
var pendingAnim = null; // WE 属性推送可能早于动画就绪，先暂存再在 buildScene 里生效

function showError(msg) { console.error(msg); document.title = "ERR " + msg; }

// 选附件最多的 skin：默认优先，同数时保持 default；遍历计数（不含透明插槽与位置标记）。
// 与预览 SpinePreview.vue 的 bestSkin 完全一致——部分皮肤（足尖弓矢、交错的温柔时光等）
// 的 default skin 只有残缺部件（如只有脚/上半身），必须选完整 skin，否则导出后缺身体。
function bestSkin(data) {
  var skins = data.skins || [];
  if (skins.length <= 1) return data.defaultSkin || skins[0];
  var best = data.defaultSkin || skins[0];
  var bestCount = -1;
  for (var si = 0; si < skins.length; si++) {
    var sk = skins[si];
    var count = 0;
    var skel = new spine.Skeleton(data);
    skel.setSkin(sk);
    skel.setSlotsToSetupPose();
    skel.updateWorldTransform();
    for (var s2 = 0; s2 < skel.slots.length; s2++) {
      var slot = skel.slots[s2], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      count++;
    }
    if (count > bestCount) {
      bestCount = count;
      best = sk;
    }
  }
  return best;
}

function loadLayer(idx) {
  var cfg = LAYERS[idx];
  var texMap = {};
  var remaining = cfg.textures.length;
  function start() {
    try {
      var glTex = {};
      // 贴图是预乘 alpha（RGB ≤ alpha），原样上传；设 true 会再乘一次 alpha 导致半透明区域变暗。
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      Object.keys(texMap).forEach(function (p) { glTex[p] = new spine.webgl.GLTexture(gl, texMap[p]); });
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      var atlas = new spine.TextureAtlas(cfg.atlasText, function (page) { return glTex[page] || glTex[Object.keys(glTex)[0]]; });
      var loader = new spine.AtlasAttachmentLoader(atlas);
      var bin = atob(cfg.skelData);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var data = new spine.SkeletonBinary(loader).readSkeletonData(bytes);
      var skeleton = new spine.Skeleton(data);
      skeleton.setSkin(bestSkin(data));
      skeleton.setSlotsToSetupPose();
      skeleton.updateWorldTransform();
      var state = new spine.AnimationState(new spine.AnimationStateData(data));
      pending[idx] = { skeleton: skeleton, state: state, data: data, name: cfg.name };
    } catch (e) { showError("layer " + cfg.name + ": " + e.message); return; }
    loadedCount++;
    if (loadedCount >= LAYERS.length) buildScene();
  }
  if (!remaining) { start(); return; }
  cfg.textures.forEach(function (t) {
    var img = new Image();
    img.onload = function () { texMap[t.page] = img; if (--remaining === 0) start(); };
    img.onerror = function () { showError("texture fail " + t.file); };
    img.src = t.file;
  });
}

function pickAnim(sd) {
  var names = sd.animations.map(function (a) { return a.name; });
  var idle = names.find(function (n) { return /idle/i.test(n); }) || names.find(function (n) { return n === "normal"; });
  return idle || names[0] || "";
}

function playAnim(name) {
  pendingAnim = name || null;
  if (!skeletons.length) return;
  var shared = name || pickAnim(skeletons[0].data);
  skeletons.forEach(function (l) {
    var t = shared && l.data.animations.some(function (a) { return a.name === shared; }) ? shared : pickAnim(l.data);
    if (t) l.state.setAnimation(0, t, true);
  });
}

// WE combo 的 value 可能是动画名（{label,value} 格式的隐藏值），
// 也可能是下标（字符串/数字），这里兼容两种情况。
function animNameFromValue(v) {
  if (typeof v === "number") return ANIM_OPTIONS[v] || null;
  if (typeof v === "string") {
    if (ANIM_OPTIONS.indexOf(v) >= 0) return v;
    var n = parseInt(v, 10);
    if (!isNaN(n) && ANIM_OPTIONS[n]) return ANIM_OPTIONS[n];
  }
  return null;
}

function isBgLayer(l) {
  // 背景层识别：skel 名去掉 .skel 后以 B/BG/_B/bg/_bg（可带数字）结尾
  if (!l || !l.skeleton || !l.name) return false;
  return /b(?:g)?\d*$/i.test(l.name.replace(/\.skel$/i, ''));
}

function renderOrder() {
  // 背景层永远先画：layers 顺序来自文件名排序，不保证 B 在前
  var bg = skeletons.filter(isBgLayer);
  var rest = skeletons.filter(function (l) { return !isBgLayer(l); });
  return bg.concat(rest);
}

function applyCharacterFit() {
  // 场景型皮肤“人物适配”：人物骨架明显大于背景层时（月下起舞 2 倍、秘密特训 1.5 倍），
  // 等比缩小到背景高度 70%，使其不超过背景、保持合适比例（与官方海报一致）。
  // 只缩不放；人物高度 ≤ 背景 1.15 倍时保持原样。中心锚点 x = cx*(1-s)。
  var bgLayers = skeletons.filter(isBgLayer);
  if (!bgLayers.length) return;
  var bgFrame = layerBounds(bgLayers[0]);
  if (!isFinite(bgFrame.minX)) return;
  var charLayers = skeletons.filter(function (l) { return !isBgLayer(l); });
  if (!charLayers.length) return;
  var per = charLayers.map(layerBounds).filter(function (b) { return isFinite(b.minX); });
  if (!per.length) return;
  var cMinX = Math.min.apply(null, per.map(function (b) { return b.minX; }));
  var cMaxX = Math.max.apply(null, per.map(function (b) { return b.maxX; }));
  var cMinY = Math.min.apply(null, per.map(function (b) { return b.minY; }));
  var cMaxY = Math.max.apply(null, per.map(function (b) { return b.maxY; }));
  var bgH = bgFrame.maxY - bgFrame.minY;
  var charH = cMaxY - cMinY;
  if (!bgH || !charH || charH <= bgH * 1.15) return;
  var s = (bgH * 0.7) / charH;
  var cx = (cMinX + cMaxX) / 2, cy = (cMinY + cMaxY) / 2;
  for (var i = 0; i < charLayers.length; i++) {
    var sk = charLayers[i].skeleton;
    sk.x = cx * (1 - s);
    sk.y = cy * (1 - s);
    sk.scaleX = s;
    sk.scaleY = s;
    sk.updateWorldTransform();
  }
}

function buildScene() {
  skeletons = [];
  for (var i = 0; i < pending.length; i++) if (pending[i]) skeletons.push(pending[i]);
  playAnim(pendingAnim || ANIMATION);
  // 把动画推进到 t=0，用初始姿态构建稳定的边界缓存（避免动画特效撑爆边界）
  skeletons.forEach(function (l) {
    l.state.update(0);
    l.state.apply(l.skeleton);
    l.skeleton.updateWorldTransform();
  });
  // 风景型皮肤：人物远大于背景时等比缩小到背景内（如 月下起舞）
  applyCharacterFit();
  computeBounds();
  applyLayout();
  lastFrame = performance.now() / 1000;
  canvas.classList.add("ready");
  requestAnimationFrame(render);
}

function layerBounds(l) {
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (var i = 0; i < l.skeleton.slots.length; i++) {
    var slot = l.skeleton.slots[i], att = slot.getAttachment();
    if (!att) continue;
    // 透明插槽与 kkkkk 位置标记附件不参与取景（避免包围盒被撑爆、角色出视野）
    if (slot.color && slot.color.a < 0.01) continue;
    if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
    var isRegion = att instanceof spine.RegionAttachment;
    if (!isRegion && !(att instanceof spine.MeshAttachment) && !(att instanceof spine.BoundingBoxAttachment)) continue;
    var len = isRegion ? 8 : att.worldVerticesLength;
    if (!len) continue;
    var verts = spine.Utils.newFloatArray(len);
    if (isRegion) att.computeWorldVertices(slot.bone, verts, 0, 2);
    else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
    for (var j = 0; j < len; j += 2) {
      if (verts[j] < minX) minX = verts[j];
      if (verts[j] > maxX) maxX = verts[j];
      if (verts[j + 1] < minY) minY = verts[j + 1];
      if (verts[j + 1] > maxY) maxY = verts[j + 1];
    }
  }
  return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
}

function contentFrame() {
  // 按附件面积加权的网格密度取景：只框住内容密集区域，
  // 用于骨架包围盒被大面积背景网格/稀疏光效撑爆、角色被“挤”小的皮肤
  var raw = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  var items = [];
  skeletons.forEach(function (l) {
    for (var i = 0; i < l.skeleton.slots.length; i++) {
      var slot = l.skeleton.slots[i], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      var isRegion = att instanceof spine.RegionAttachment;
      var isMesh = att instanceof spine.MeshAttachment;
      if (!isRegion && !isMesh) continue;
      var len = isRegion ? 8 : att.worldVerticesLength;
      if (!len) continue;
      var verts = spine.Utils.newFloatArray(len);
      if (isRegion) att.computeWorldVertices(slot.bone, verts, 0, 2);
      else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
      var b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (var j = 0; j < len; j += 2) {
        if (verts[j] < b.minX) b.minX = verts[j];
        if (verts[j] > b.maxX) b.maxX = verts[j];
        if (verts[j + 1] < b.minY) b.minY = verts[j + 1];
        if (verts[j + 1] > b.maxY) b.maxY = verts[j + 1];
      }
      items.push(b);
      if (b.minX < raw.minX) raw.minX = b.minX;
      if (b.maxX > raw.maxX) raw.maxX = b.maxX;
      if (b.minY < raw.minY) raw.minY = b.minY;
      if (b.maxY > raw.maxY) raw.maxY = b.maxY;
    }
  });
  if (!items.length) return null;
  var rawW = raw.maxX - raw.minX, rawH = raw.maxY - raw.minY;
  var N = 64;
  var gw = rawW / N || 1, gh = rawH / N || 1;
  var grid = new Float64Array(N * N);
  for (var k = 0; k < items.length; k++) {
    var bb = items[k];
    var cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;
    var gx = Math.min(N - 1, Math.max(0, Math.floor((cx - raw.minX) / gw)));
    var gy = Math.min(N - 1, Math.max(0, Math.floor((cy - raw.minY) / gh)));
    grid[gy * N + gx] += Math.max(1, (bb.maxX - bb.minX) * (bb.maxY - bb.minY));
  }
  var maxCell = 0;
  for (var v = 0; v < grid.length; v++) if (grid[v] > maxCell) maxCell = grid[v];
  if (!maxCell) return null;
  var threshold = maxCell * 0.02;
  var fminX = raw.maxX, fmaxX = raw.minX, fminY = raw.maxY, fmaxY = raw.minY, kept = 0;
  for (var gy2 = 0; gy2 < N; gy2++) {
    for (var gx2 = 0; gx2 < N; gx2++) {
      if (grid[gy2 * N + gx2] >= threshold) {
        kept++;
        if (raw.minX + gx2 * gw < fminX) fminX = raw.minX + gx2 * gw;
        if (raw.minX + (gx2 + 1) * gw > fmaxX) fmaxX = raw.minX + (gx2 + 1) * gw;
        if (raw.minY + gy2 * gh < fminY) fminY = raw.minY + gy2 * gh;
        if (raw.minY + (gy2 + 1) * gh > fmaxY) fmaxY = raw.minY + (gy2 + 1) * gh;
      }
    }
  }
  var fW = fmaxX - fminX, fH = fmaxY - fminY;
  var ratioW = fW / rawW, ratioH = fH / rawH;
  if (!kept || ratioW > 0.55 || ratioH > 0.55 || ratioW < 0.08 || ratioH < 0.08) return null;
  var padX = fW * 0.15, padY = fH * 0.15;
  return { minX: fminX - padX, maxX: fmaxX + padX, minY: fminY - padY, maxY: fmaxY + padY };
}

function denseAreaFrame() {
  // 面积过滤取景：保留面积 ≤ 最大附件 40% 的部件（跨所有层），滤掉超大背景/云朵。
  // 返回 null 表示不适用（内容未被撑爆），调用方回退常规逻辑。
  var raw = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  var items = [];
  skeletons.forEach(function (l) {
    for (var i = 0; i < l.skeleton.slots.length; i++) {
      var slot = l.skeleton.slots[i], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      var isRegion = att instanceof spine.RegionAttachment;
      var isMesh = att instanceof spine.MeshAttachment;
      if (!isRegion && !isMesh) continue;
      var len = isRegion ? 8 : att.worldVerticesLength;
      if (!len) continue;
      var verts = spine.Utils.newFloatArray(len);
      if (isRegion) att.computeWorldVertices(slot.bone, verts, 0, 2);
      else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
      var b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (var j = 0; j < len; j += 2) {
        if (verts[j] < b.minX) b.minX = verts[j];
        if (verts[j] > b.maxX) b.maxX = verts[j];
        if (verts[j + 1] < b.minY) b.minY = verts[j + 1];
        if (verts[j + 1] > b.maxY) b.maxY = verts[j + 1];
      }
      items.push(b);
      if (b.minX < raw.minX) raw.minX = b.minX;
      if (b.maxX > raw.maxX) raw.maxX = b.maxX;
      if (b.minY < raw.minY) raw.minY = b.minY;
      if (b.maxY > raw.maxY) raw.maxY = b.maxY;
    }
  });
  if (!items.length) return null;
  var rawW = raw.maxX - raw.minX, rawH = raw.maxY - raw.minY;
  var areas = items.map(function (b) { return (b.maxX - b.minX) * (b.maxY - b.minY); });
  var maxA = Math.max.apply(null, areas);
  // 最大附件本身就占满画面（无超大背景）时不适用
  if (maxA >= rawW * rawH * 0.8) return null;
  var keep = items.filter(function (b, i) { return areas[i] <= maxA * 0.4; });
  if (!keep.length) return null;
  // 在过滤后的集合上再做一次网格密度裁剪：滤掉散落的浪花/骷髅/云朵等
  // 分散装饰（如 DEAD MASTER·战士的小憩），把取景收到角色主体。
  var N = 64;
  var gw = rawW / N || 1, gh = rawH / N || 1;
  var grid = new Float64Array(N * N);
  for (var k = 0; k < keep.length; k++) {
    var bb = keep[k];
    var cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;
    var gx = Math.min(N - 1, Math.max(0, Math.floor((cx - raw.minX) / gw)));
    var gy = Math.min(N - 1, Math.max(0, Math.floor((cy - raw.minY) / gh)));
    grid[gy * N + gx] += Math.max(1, (bb.maxX - bb.minX) * (bb.maxY - bb.minY));
  }
  var maxCell = 0;
  for (var v = 0; v < grid.length; v++) if (grid[v] > maxCell) maxCell = grid[v];
  if (!maxCell) return null;
  var threshold = maxCell * 0.02;
  var fminX = raw.maxX, fmaxX = raw.minX, fminY = raw.maxY, fmaxY = raw.minY, keptCells = 0;
  for (var gy2 = 0; gy2 < N; gy2++) {
    for (var gx2 = 0; gx2 < N; gx2++) {
      if (grid[gy2 * N + gx2] >= threshold) {
        keptCells++;
        if (raw.minX + gx2 * gw < fminX) fminX = raw.minX + gx2 * gw;
        if (raw.minX + (gx2 + 1) * gw > fmaxX) fmaxX = raw.minX + (gx2 + 1) * gw;
        if (raw.minY + gy2 * gh < fminY) fminY = raw.minY + gy2 * gh;
        if (raw.minY + (gy2 + 1) * gh > fmaxY) fmaxY = raw.minY + (gy2 + 1) * gh;
      }
    }
  }
  var fW = fmaxX - fminX, fH = fmaxY - fminY;
  // 网格保留太少（内容过于稀疏）或过滤后仍占满 90%+：回退原逻辑
  if (!keptCells || fW >= rawW * 0.9 || fH >= rawH * 0.9) return null;
  var padX = fW * 0.12, padY = fH * 0.12;
  return { minX: fminX - padX, maxX: fmaxX + padX, minY: fminY - padY, maxY: fmaxY + padY };
}

function computeBounds() {
  // 与预览 SpinePreview.vue 完全一致的取景链：
  // 背景层基准（有 B/_B/bg/_bg 后缀时）→ contentFrame（网格密度）
  // → denseAreaFrame（面积过滤）→ 逐层兜底。
  // 缺第二道时，背景被云朵/大面积装饰撑爆的皮肤（战士的小憩等）会取到巨大
  // 包围盒，导出后角色明显偏小——这就是“预览合适、壁纸偏小”的根因。
  if (boundsCache) return boundsCache;
  // 有显式背景层时以背景层为取景基准（背景定义整幅场景）；
  // 护栏：背景面积超过主体层 8 倍时视为装饰性大背景，回退常规取景。
  var bgLayers = skeletons.filter(isBgLayer);
  if (bgLayers.length) {
    var bgFrame = layerBounds(bgLayers[0]);
    var nonBg = [];
    skeletons.forEach(function (l) {
      if (!isBgLayer(l)) {
        var b = layerBounds(l);
        if (isFinite(b.minX)) nonBg.push(b);
      }
    });
    if (isFinite(bgFrame.minX) && nonBg.length) {
      var bgArea = (bgFrame.maxX - bgFrame.minX) * (bgFrame.maxY - bgFrame.minY) || 1;
      var maxOther = Math.max.apply(null, nonBg.map(function (b) {
        return (b.maxX - b.minX) * (b.maxY - b.minY);
      }));
      // 护栏：背景面积在主体层的 [0.15, 8] 倍之间才适用背景取景。
      // 过小（装饰性小背景）会把人物撑爆裁切；过大（云朵类大背景）会重新
      // 把角色挤小，两种情况都回退常规取景。
      var bgW = bgFrame.maxX - bgFrame.minX;
      var bgH = bgFrame.maxY - bgFrame.minY;
      // 背景必须横构图（宽≥高）：竖构图背景（如 华甲_2 的窄背板）是装饰
      // 性布景，按它取景会裁掉人物并留大片黑边。
      if (bgArea >= maxOther * 0.15 && bgArea <= maxOther * 8 && bgW >= bgH) {
        var padX = (bgFrame.maxX - bgFrame.minX) * 0.08;
        var padY = (bgFrame.maxY - bgFrame.minY) * 0.08;
        boundsCache = {
          minX: bgFrame.minX - padX, maxX: bgFrame.maxX + padX,
          minY: bgFrame.minY - padY, maxY: bgFrame.maxY + padY,
        };
        return boundsCache;
      }
    }
  }
  var dense = contentFrame();
  if (dense) { boundsCache = dense; return boundsCache; }
  var areaFrame = denseAreaFrame();
  if (areaFrame) { boundsCache = areaFrame; return boundsCache; }
  var per = [];
  skeletons.forEach(function (l) {
    l.skeleton.updateWorldTransform();
    var b = layerBounds(l);
    if (isFinite(b.minX)) per.push(b);
  });
  if (!per.length) { boundsCache = { minX: -1, maxX: 1, minY: -1, maxY: 1 }; return boundsCache; }
  var small = per[0];
  for (var k = 1; k < per.length; k++) {
    var a = (per[k].maxX - per[k].minX) * (per[k].maxY - per[k].minY);
    var ra = (small.maxX - small.minX) * (small.maxY - small.minY);
    if (a < ra) small = per[k];
  }
  var baseArea = (small.maxX - small.minX) * (small.maxY - small.minY) || 1;
  var frame = per.filter(function (b) {
    return (b.maxX - b.minX) * (b.maxY - b.minY) <= baseArea * 4;
  });
  boundsCache = {
    minX: Math.min.apply(null, frame.map(function (b) { return b.minX; })),
    maxX: Math.max.apply(null, frame.map(function (b) { return b.maxX; })),
    minY: Math.min.apply(null, frame.map(function (b) { return b.minY; })),
    maxY: Math.max.apply(null, frame.map(function (b) { return b.maxY; })),
  };
  return boundsCache;
}

function applyLayout() {
  if (!skeletons.length || !renderer) return;
  var a = WallpaperLayout.anchor(ALIGNMENT);
  var cam = WallpaperLayout.spineCamera(computeBounds(), canvas.clientWidth, canvas.clientHeight, {
    scale: SCALE,
    offsetX: OFFSET_X,
    offsetY: OFFSET_Y,
    alignX: a.x,
    alignY: a.y
  });
  renderer.camera.zoom = cam.zoom;
  renderer.camera.position.x = cam.x;
  renderer.camera.position.y = cam.y;
  renderer.camera.position.z = 0;
}

function render() {
  var now = performance.now() / 1000;
  var delta = Math.min(0.1, now - lastFrame);
  lastFrame = now;
  if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
    canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
    renderer.camera.setViewport(canvas.width, canvas.height);
    applyLayout();
  }
  skeletons.forEach(function (l) { l.state.update(delta); l.state.apply(l.skeleton); l.skeleton.updateWorldTransform(); });
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  renderer.begin();
  renderOrder().forEach(function (l) { renderer.drawSkeleton(l.skeleton, true); });
  renderer.end();
  requestAnimationFrame(render);
}

// WE 加载时会先推送一次“全部属性”（含 config.json 里按路径存的历史覆盖值）。
// 该覆盖值可能来自用户在 WE 里手动拖滑块，也可能来自编辑器导入误写；无论哪种，
// 都不应覆盖导出时调好的版式——壁纸一律以导出值（SCALE/OFFSET/ALIGNMENT）为准。
// 唯一例外：动画切换，若 WE 里保存过用户选择则恢复它，否则保持导出默认动画。
var _initialPropsApplied = false;
window.wallpaperPropertyListener = {
  applyUserProperties: function (properties) {
    try {
      if (!_initialPropsApplied) {
        _initialPropsApplied = true;
        var firstName = properties.animselect ? animNameFromValue(properties.animselect.value) : null;
        if (firstName) playAnim(firstName);
        return;
      }
      if (properties.scalectrl) SCALE = properties.scalectrl.value;
      if (properties.offsetx) OFFSET_X = properties.offsetx.value;
      if (properties.offsety) OFFSET_Y = properties.offsety.value;
      if (properties.alignment) ALIGNMENT = WallpaperLayout.ALIGN_ORDER[properties.alignment.value] || ALIGNMENT;
      if (properties.animselect) {
        var animName = animNameFromValue(properties.animselect.value);
        if (animName) playAnim(animName);
      }
      if (skeletons.length) applyLayout();
    } catch (e) {}
  }
};

window.__captureCanvasDataURL = function () {
  try { return canvas.toDataURL("image/png"); } catch (e) { return ""; }
};

function init() {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  gl = canvas.getContext("webgl", { alpha: true }) || canvas.getContext("experimental-webgl", { alpha: true });
  if (!gl) { showError("WebGL not supported"); return; }
  renderer = new spine.webgl.SceneRenderer(canvas, gl, false);
  for (var i = 0; i < LAYERS.length; i++) loadLayer(i);
}
window.addEventListener("resize", function () {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  if (renderer) { gl.viewport(0, 0, canvas.width, canvas.height); renderer.camera.setViewport(canvas.width, canvas.height); }
  if (skeletons.length) applyLayout();
});
window.addEventListener("load", init);
</script>
</body>
</html>
